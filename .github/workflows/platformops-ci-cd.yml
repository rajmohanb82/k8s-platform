
name: PlatformOps CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/platformops-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformops-production
  cancel-in-progress: false

jobs:
  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest

      - name: Run pytest
        run: python -m pytest -v

  publish:
    name: Build and Publish to GHCR
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/platformops" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Update GitOps Configuration
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: rajmohanb82/k8s-platform-gitops
          ref: main
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          persist-credentials: false
          path: gitops

      - name: Install PyYAML
        run: python -m pip install PyYAML

      - name: Update Helm image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("gitops/helm/platformops/values-gitops.yaml")
          values = yaml.safe_load(path.read_text())

          values["image"]["repository"] = os.environ["IMAGE"]
          values["image"]["tag"] = os.environ["TAG"]
          values["image"]["pullPolicy"] = "IfNotPresent"

          path.write_text(
              yaml.safe_dump(values, sort_keys=False)
          )
          PY

      - name: Commit GitOps update
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
        shell: bash
        run: |
          git config user.name "platformops-ci"
          git config user.email "platformops-ci@users.noreply.github.com"

          git add helm/platformops/values-gitops.yaml

          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi

          git commit -m "deploy: PlatformOps ${IMAGE_TAG}"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c \
            http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
            push origin HEAD:main
