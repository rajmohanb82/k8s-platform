---
# Source: platformops/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: platformops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platformops
    app.kubernetes.io/instance: platformops
  ports:
    - name: http
      port: 80
      targetPort: 5252
      nodePort: 30080
      protocol: TCP

---
# Source: platformops/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformops
  labels:
    app.kubernetes.io/name: platformops
    app.kubernetes.io/instance: platformops
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: platformops
      app.kubernetes.io/instance: platformops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platformops
        app.kubernetes.io/instance: platformops
    spec:
      containers:
        - name: platformops
          image: "platformops:v1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5252
          env:
            - name: APP_VERSION
              value: "v1.0.0"
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10


